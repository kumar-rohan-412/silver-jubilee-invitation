<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4eadb">
<title>A Special Invitation Awaits | Silver Jubilee</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f4eadb;--brown:#4a2c20;--gold:#b8954e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Cormorant Garamond",Georgia,serif}
body{background:#21170f;display:flex;align-items:center;justify-content:center;padding:14px;color:var(--brown)}
.shell{width:min(100%,560px);min-height:min(94dvh,900px);background:var(--ivory);border:1px solid var(--gold);border-radius:22px;box-shadow:0 18px 60px #0008;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:26px 20px}
.shell:before{content:"";position:absolute;inset:9px;border:1px solid #b8954e;border-radius:15px;pointer-events:none}
.shell:after{content:"";position:absolute;inset:15px;border:1px solid #d6bd8c;border-radius:11px;pointer-events:none}
.cover{position:relative;z-index:1;width:100%;max-width:390px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:17px;padding:18px 10px}
.eyebrow{font:600 12px Cinzel,serif;letter-spacing:.19em;color:#80582e}
.portrait-frame{width:min(72vw,300px);aspect-ratio:3/4;background:#eee1cb;border:1px solid #c9a967;border-radius:24px;padding:0;box-shadow:0 12px 28px #553b202b;display:block;overflow:hidden}
.portrait-frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;border:0;border-radius:22px;background:#eee1cb}
.open{appearance:none;border:0;border-radius:999px;background:linear-gradient(135deg,#654128,#432719);color:#fffaf0;padding:15px 28px;font:700 15px Arial,sans-serif;letter-spacing:.02em;box-shadow:0 6px 16px #4a2c2033;cursor:pointer;min-height:52px}
.open:active{transform:scale(.98)}
.kicker{font:italic 600 22px "Cormorant Garamond",serif;color:#765633;margin:0}
.footer{font:italic 17px "Cormorant Garamond",serif;color:#80582e;line-height:1.35;max-width:330px;margin:0}
#experience{display:none;position:fixed;inset:0;background:#15110b;z-index:5}
#experience iframe{border:0;width:100%;height:100%;display:block}
body.opened{padding:0;display:block;overflow:hidden}
body.opened .shell{display:none}
body.opened #experience{display:block}
@media(max-height:650px){.shell{min-height:96dvh;padding:10px}.cover{gap:9px;padding:8px}.portrait-frame{height:38vh;width:auto;aspect-ratio:3/4;max-width:72vw}.kicker{font-size:19px}.footer{font-size:15px}}
</style>
</head>
<body>
<main class="shell">
  <section class="cover" aria-label="Silver Jubilee invitation cover">
    <div class="eyebrow">A SPECIAL INVITATION AWAITS</div>
    <div class="portrait-frame">
      <img src="front-photo.jpeg" alt="The couple celebrating their Silver Jubilee">
    </div>
    <button class="open" id="openInvite" type="button">Open your invitation link</button>
    <div class="kicker">Celebrating 25 beautiful years</div>
    <div class="footer">An evening of cherished moments awaits, and it would be incomplete without you.</div>
  </section>
</main>
<div id="experience"><iframe id="cardFrame" title="Silver Jubilee invitation" src="invitation.html"></iframe></div>
<script>
(function(){
  var button=document.getElementById('openInvite');
  var frame=document.getElementById('cardFrame');
  var opened=false;
  button.addEventListener('click',function(){
    if(opened)return;
    opened=true;
    document.body.classList.add('opened');
    try{
      var doc=frame.contentDocument;
      var musicButton=doc && doc.getElementById('mu');
      if(musicButton){musicButton.click();}
    }catch(e){}
  });
})();
</script>
</body>
</html>
